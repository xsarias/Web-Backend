<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marachet</title>
    <link rel="stylesheet" href="marachet.css">
</head>

<body class="light-marachet-theme">
    <h1 class="marachet-title">Marachet</h1>
    <p id="msg">Emprendimiento creado por Xiomara Arias, para la venta de productos hechos a mano en crochet:</p>
    <ul>
        <li class="list">Amigurumis personalizados.</li>
        <li class="list">Llaveros.</li>
        <li class="list">Todo lo que te imagines, lo puedo hacer realidad (en su mayoría).</li>
    </ul>
    <div>
        <button class="btn">
            <img src="./resources/dark_mode.png">

        </button>
    </div>
    <div class="carousel-wrapper">
        <button class="nav-button prev-btn" aria-label="Anterior">&#10094;</button>
        <div class="carousel">
            <div class="slide"><img src="./resources/gato.png"></div>
            <div class="slide"><img src="./resources/corage.png"></div>
            <div class="slide"><img src="./resources/pollitos.png"></div>
            <div class="slide"><img src="./resources/snoopy.png"></div>

        </div>
        <button class="nav-button next-btn" aria-label="Siguiente">&#10095;</button>
    </div>
    <div class="social-media">
        Síguenos en:
        <a class="insta-btn" href="https://www.instagram.com/marachet_/" target="_blank" rel="noopener noreferrer">
            <img src="./resources/instagram.png" alt="Síguenos en Instagram">
        </a>
    </div>

    <script src="app.js"></script>
    <noscript>You need to enable JavaScript to view the full site.</noscript>
</body>

</html>
